{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-header">
        <h1>Create Account</h1>
        <p>Join the Organ Donor Sharing Network</p>
    </div>

    <form method="post">
        <div class="role-selector">
            <div class="role-option">
                <input type="radio" id="role_donor" name="role" value="donor" checked onchange="toggleDonorFields()">
                <label for="role_donor" class="role-label">I am a Donor</label>
            </div>
            <div class="role-option">
                <input type="radio" id="role_hospital" name="role" value="hospital" onchange="toggleDonorFields()">
                <label for="role_hospital" class="role-label">I am a Hospital</label>
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input name="username" id="username" type="text" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input name="password" id="password" type="password" required>
        </div>

        <div id="donor-specific-fields" class="donor-fields" style="display: block;">
            <div class="form-group">
                <label for="blood_type">Blood Type</label>
                <select name="blood_type" id="blood_type">
                    <option value="">Select...</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="organ_type">Organ You Wish to Donate</label>
                <select name="organ_type" id="organ_type">
                    <option value="">Select...</option>
                    <option value="Kidney">Kidney</option>
                    <option value="Liver">Liver</option>
                    <option value="Heart">Heart</option>
                    <option value="Lungs">Lungs</option>
                    <option value="Pancreas">Pancreas</option>
                </select>
            </div>

            <div class="form-group">
                <label for="medical_history">Brief Medical History</label>
                <textarea name="medical_history" id="medical_history"
                    placeholder="Any relevant past conditions..."></textarea>
            </div>
        </div>

        <button class="btn btn-primary" style="width: 100%;" type="submit">Create Account</button>

        <div class="form-footer">
            Already have an account? <a href="{{ url_for('login') }}">Log in</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    function toggleDonorFields() {
        const isDonor = document.getElementById('role_donor').checked;
        const fields = document.getElementById('donor-specific-fields');
        fields.style.display = isDonor ? 'block' : 'none';

        // Toggle required status based on visibility
        const selects = fields.querySelectorAll('select');
        selects.forEach(select => {
            if (isDonor) {
                select.setAttribute('required', 'required');
            } else {
                select.removeAttribute('required');
            }
        });
    }
    // Run on load
    document.addEventListener("DOMContentLoaded", toggleDonorFields);
</script>
{% endblock %}
